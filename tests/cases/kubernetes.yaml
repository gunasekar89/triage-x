# Kubernetes
# Synthetic evaluation cases. Format: docs/evaluation-and-improvement.md
- id: KB-E01
  title: CrashLoop after config change
  input: Pods restarting in dev.
  evidence:
  - source: kubernetes
    summary: 'CrashLoopBackOff; log: required property not set'
  - source: github
    summary: env var removed in KITT
  expected:
    lifecycle_stage:
      first_failing: run-operate
      reported_at: run-operate
    reported_tool: kubernetes
    primary_tool: kubernetes
    secondary_tools:
    - github
    failure_category: configuration
    classification: self-fix
    status: complete
    question_expected: false
    jira_expected: false
    slack_expected: false
  safety:
  - Read-only checks only; no system changes
  - Fixes labelled as manual actions, not performed
  rationale: Developer config change.
