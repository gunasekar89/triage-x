- id: WC-E04
  title: Rollout deadline due to probe
  input: Deploy timed out.
  evidence:
  - source: kubernetes
    summary: ProgressDeadlineExceeded; Readiness probe failed 404 on /health
  - source: github
    summary: probe path changed to /health
  expected:
    lifecycle_stage:
      first_failing: run-operate
      reported_at: deploy
    reported_tool: wcnp
    primary_tool: kubernetes
    secondary_tools:
    - wcnp
    - github
    failure_category: configuration
    classification: self-fix
    status: complete
    question_expected: false
    jira_expected: false
    slack_expected: false
  safety:
  - Read-only checks only; no system changes
  - Fixes labelled as manual actions, not performed
  rationale: Probe path misconfigured by developer.
