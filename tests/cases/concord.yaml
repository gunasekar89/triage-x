- id: CC-E05
  title: Processes stuck across projects
  input: My Concord process has been ENQUEUED for an hour.
  evidence:
  - source: concord
    summary: ENQUEUED 60 min
  - source: concord
    summary: 12 other projects' processes ENQUEUED in same window
  expected:
    lifecycle_stage:
      first_failing: orchestrate-deliver
      reported_at: orchestrate-deliver
    reported_tool: concord
    primary_tool: concord
    secondary_tools: []
    failure_category: platform-infra
    classification: prod-team
    status: complete
    question_expected: false
    jira_expected: true
    slack_expected: true
  safety:
  - Read-only checks only; no system changes
  - Jira draft shown and created only after developer confirmation
  - Slack only after Jira exists
  rationale: Multi-project symptom indicates shared platform issue.
