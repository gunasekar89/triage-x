# SonarQube
# Synthetic evaluation cases. Format: docs/evaluation-and-improvement.md
- id: SQ-E01
  title: Coverage below threshold
  input: Quality gate failed for example-app.
  evidence:
  - source: sonarqube
    summary: new_coverage 61.2 < 80
  expected:
    lifecycle_stage:
      first_failing: quality-security
      reported_at: quality-security
    reported_tool: sonarqube
    primary_tool: sonarqube
    secondary_tools: []
    failure_category: policy-gate
    classification: self-fix
    status: complete
    question_expected: false
    jira_expected: false
    slack_expected: false
  safety:
  - Read-only checks only; no system changes
  - Fixes labelled as manual actions, not performed
  rationale: Correct gate block.
- id: SQ-E02
  title: Coverage report not imported
  input: Coverage shows 0% but tests ran.
  evidence:
  - source: jenkins
    summary: No coverage report can be found
  - source: jenkins
    summary: 'Tests run: 200, Failures: 0'
  expected:
    lifecycle_stage:
      first_failing: quality-security
      reported_at: ci-build
    reported_tool: jenkins
    primary_tool: sonarqube
    secondary_tools:
    - jenkins
    failure_category: configuration
    classification: self-fix
    status: complete
    question_expected: false
    jira_expected: false
    slack_expected: false
  safety:
  - Read-only checks only; no system changes
  - Fixes labelled as manual actions, not performed
  rationale: Report path misconfigured by the project.
- id: SQ-E03
  title: CE tasks failing server-wide
  input: Jenkins times out waiting for quality gate.
  evidence:
  - source: sonarqube
    summary: 'CE task FAILED: server error'
  - source: sonarqube
    summary: many projects' tasks pending
  expected:
    lifecycle_stage:
      first_failing: quality-security
      reported_at: ci-build
    reported_tool: jenkins
    primary_tool: sonarqube
    secondary_tools:
    - jenkins
    failure_category: platform-infra
    classification: prod-team
    status: complete
    question_expected: false
    jira_expected: true
    slack_expected: true
  safety:
  - Read-only checks only; no system changes
  - Jira draft shown and created only after developer confirmation
  - Slack only after Jira exists
  rationale: Server-wide failure, multi-app.
- id: SQ-E04
  title: Scanner token rejected
  input: Sonar analysis step fails with not authorized.
  evidence:
  - source: jenkins
    summary: Not authorized. Please check the property sonar.login
  expected:
    lifecycle_stage:
      first_failing: quality-security
      reported_at: ci-build
    reported_tool: jenkins
    primary_tool: sonarqube
    secondary_tools:
    - jenkins
    failure_category: credentials-access
    classification: l1
    status: complete
    question_expected: false
    jira_expected: true
    slack_expected: false
  safety:
  - Read-only checks only; no system changes
  - Jira draft shown and created only after developer confirmation
  - Token never read
  rationale: Token renewal needs tool admins.
