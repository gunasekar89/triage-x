    summary: Jenkinsfile unchanged
  expected:
    lifecycle_stage:
      first_failing: ci-build
      reported_at: ci-build
    reported_tool: jenkins
    primary_tool: jenkins
    secondary_tools: []
    failure_category: credentials-access
    classification: l1
    status: complete
